<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apollodev - Cavaleiro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      line-height: 1.5;
      background: black;
      color: white;
    }
    .hero {
      max-width: 1100px;
      margin: 0 auto;
    }
    .game-area {
      display: flex;
      gap: 2rem;
      justify-content: center;
      align-items: flex-start;
      margin-top: 1.5rem;
    }
    .combatants {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      flex: 0 0 auto;
    }
    .battle-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
      padding: 0.5rem;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .card {
      background: #1f2530;
      border: 1px solid #444;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.35);
      width: 220px;
      padding: 0.9rem;
      text-align: center;
    }
    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .card h2 {
      margin: 0.65rem 0 0.35rem;
      font-size: 1rem;
    }
    .card p {
      margin: 0;
      color: #b8c2d1;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .health-status {
      margin-top: 0.75rem;
      text-align: left;
      font-size: 0.85rem;
      color: #9cf2a0;
    }
    .health-info {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #e3f8a2;
      opacity: 0.9;
    }
    .health-bar {
      width: 100%;
      height: 0.65rem;
      background: #293333;
      border: 1px solid #40705e;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.35rem;
    }
    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #69f2a6, #1a8f6e);
      border-radius: 999px;
      transition: width 1.25s ease;
    }
    .hit {
      animation: hitFlash 3s ease;
      animation-fill-mode: forwards;
      box-shadow: 0 0 0 3px rgba(255, 80, 80, 0.25);
      border-color: #ff5d5d;
    }
    @keyframes hitFlash {
      0% { transform: translateX(0) scale(1); }
      20% { transform: translateX(-4px) scale(1.02); }
      40% { transform: translateX(4px) scale(1.02); }
      60% { transform: translateX(-2px) scale(1.01); }
      80% { transform: translateX(2px) scale(1.005); }
      100% { transform: translateX(0) scale(1); }
    }
    h2 {
      color: #fff;
      margin: 1.2rem 0 0.8rem;
      font-size: 1.1rem;
    }
    pre {
      background: #07100d;
      border: 1px solid #2a3a3a;
      border-radius: 14px;
      color: #8ff2a8;
      padding: 1rem;
      max-height: 280px;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.82rem;
      line-height: 1.45;
      font-family: 'Courier New', monospace;
      text-align: left;
      margin: 0 auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }
    code {
      background: #eef;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
    }
    button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      margin-top: 1rem;
      background: #3d7dcb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #3264a8;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Batalha do Apocalipse</h1>

    <div class="game-area">
      <div class="combatants">
        <div class="card" id="card-welinton">
          <div style="font-size: 4rem; margin: 1rem 0;"c:\Users\Aluno\Downloads\—Pngtree—medieval mouse knight in armor_23967074.png></div>
          <h2>Welinton Cavaleiro</h2>
          <p>Um guerreiro forte e corajoso pronto para defender seu país do mal.</p>
          <div class="health-status">
            <div class="health-bar"><div id="health-fill-welinton" class="health-fill"></div></div>
            <div id="hp-welinton">HP: 450 / 450</div>
            <div id="status-welinton" class="health-info">Pronto para batalha</div>
          </div>
        </div>
        <div class="card" id="card-petista">
          <div style="font-size: 4rem; margin: 1rem 0;"c:\Users\Aluno\Downloads\—Pngtree—cartoon goblin_6938499.png></div>
          <h2>Goblin Petista</h2>
          <p>O inimigo burro igual o Lule e imprevisível do país.</p>
          <div class="health-status">
            <div class="health-bar"><div id="health-fill-petista" class="health-fill"></div></div>
            <div id="hp-petista">HP: 100 / 100</div>
            <div id="status-petista" class="health-info">Pronto para batalha</div>
          </div>
        </div>
      </div>

      <div class="battle-section">
        <button id="run">Começar a batalha</button>

        <h2>Log da Batalha</h2>
        <pre id="output">Console de saída do jogo.
</pre>
      </div>
    </div>
  </div>
  <script src="jogo.js"></script>
</body>
</html>
